services:
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - type: bind
        source: ./mlflow.db
        target: /mlflow-data/mlflow.db
      - type: bind
        source: ./mlruns
        target: /mlflow-data/mlruns
  inference:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      - mlflow
    

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference
